<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview</title><link rel="stylesheet" href="admin.css"><style>.preview-frame{width:100%;height:72vh;border:1px solid var(--admin-line);border-radius:14px;background:#0b102e}.preview-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-note p{margin:0}.preview-frame-wrap{overflow:hidden;border-radius:14px}</style></head><body data-page="preview"><div class="admin-content"><div class="admin-card"><div class="preview-note"><div><h1>Website preview</h1><p class="stat-label">This preview uses your current draft. It does not publish changes.</p></div><a class="admin-btn secondary" href="dashboard.html">Back to Dashboard</a></div><div class="preview-frame-wrap"><iframe id="draftPreviewFrame" class="preview-frame" src="/?preview=draft" title="Draft website preview"></iframe></div></div></div><script src="admin.js"></script><script>const section=new URLSearchParams(location.search).get('section')||'top';const frame=document.querySelector('#draftPreviewFrame');frame.src=`/?preview=draft#${section}`;</script></body></html>
