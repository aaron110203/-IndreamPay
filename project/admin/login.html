<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="admin.css"></head><body class="login-page" data-page="login"><main class="login-card"><div class="admin-brand"><span class="admin-mark">N</span><span>NovaPay Control</span></div><h1>Admin Login</h1><p>Manage your published website configuration securely.</p><form id="loginForm"><div class="form-field"><label for="email">Email or username</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="form-field" style="margin-top:16px"><label for="password">Password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button">Show</button></div></div><div id="loginError" class="login-error" role="alert"></div><button id="loginButton" class="admin-btn" type="submit">Sign in</button></form></main><script src="admin.js"></script></body></html>
