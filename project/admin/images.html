<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Images</title><link rel="stylesheet" href="admin.css"></head><body data-page="images"><div class="admin-layout"><aside class="admin-sidebar"><div class="admin-brand"><span class="admin-mark">N</span><span>NovaPay Control</span></div><nav class="admin-nav"><a href="dashboard.html">Dashboard</a><a href="settings.html">Website Settings</a><a href="branding.html">Branding</a><a href="links.html">CTA & Links</a><a href="hero.html">Hero</a><a data-page="images" href="images.html">Images</a><a href="socials.html">Social Links</a><a href="theme.html">Theme</a><a href="sections.html">Sections</a><a href="faq.html">FAQ</a><a href="activity.html">Activity Log</a></nav><button id="logout" class="admin-logout">Logout</button></aside><main class="admin-main"><header class="admin-topbar"><button id="menuToggle" class="admin-mobile-toggle">☰</button><h1>Image management</h1><span id="adminUser" class="admin-user"></span></header><section class="admin-content"><div class="admin-card"><h2>Upload image</h2><form id="imageForm"><div class="form-grid"><div class="form-field"><label>Slot</label><select name="slot"><option value="heroImage">Hero Image</option><option value="backgroundImage">Background Image</option><option value="securityImage">Security Image</option><option value="rewardsImage">Rewards Image</option></select></div><div class="form-field"><label>File</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" required></div></div><div class="admin-actions"><button class="admin-btn" type="submit">Upload to Draft</button></div></form></div></section></main></div><div id="toast" class="toast"></div><script src="admin.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await (async()=>{try{await fetch('/api/admin/me',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw 0});return true}catch{location.href='/admin/login.html';return false}})())return;document.querySelector('#imageForm').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);const r=await fetch('/api/admin/images',{method:'POST',body:form,credentials:'same-origin'});const b=await r.json();document.querySelector('#toast').textContent=r.ok?'Image uploaded to draft':b.error;document.querySelector('#toast').classList.add('show');setTimeout(()=>document.querySelector('#toast').classList.remove('show'),2200)})})</script></body></html>
